<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background:#eef2ff;
    }

    .edit-card{
        border:none;
        border-radius:20px;
    }

    .form-control,
    .form-select{
        border-radius:12px;
        padding:12px;
    }

    .btn{
        border-radius:12px;
    }

    .page-title{
        font-weight:700;
    }
</style>

</head>

<body>

<div class="container mt-5">


<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow edit-card">

            <div class="card-body p-4">

                <h2 class="page-title mb-4">
                    ✏️ Edit Contact
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Name</label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ contact.name }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ contact.email }}"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ contact.phone }}"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category</label>

                        <select
                            name="category"
                            class="form-select"
                        >

                            <option value="">
                                No Category
                            </option>

                            {% for category in categories %}

                            <option
                                value="{{ category.id }}"
                                {% if contact.category and contact.category.id == category.id %}
                                    selected
                                {% endif %}
                            >
                                {{ category.name }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Contact
                        </button>

                        <a
                            href="{% url 'index' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


</div>

</body>
</html>
