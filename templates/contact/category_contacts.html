<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} Contacts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#eef2ff;
        }

        .navbar-custom{
            background:#2563eb;
        }

        .dashboard-card{
            border:none;
            border-radius:18px;
        }

        .contact-card{
            border:none;
            border-radius:15px;
            transition:.3s;
        }

        .contact-card:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,0,0,.08);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark navbar-custom shadow">
    <div class="container">

        <span class="navbar-brand fw-bold">
            📒 MyContact
        </span>

        <a href="{% url 'index' %}"
           class="btn btn-light">
            Dashboard
        </a>

    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow dashboard-card mb-4">

        <div class="card-body text-center">

            <h1 class="fw-bold">
                {{ category.name }}
            </h1>

            <p class="text-muted mb-0">
                Contacts in this category
            </p>

        </div>

    </div>

    <div class="card shadow dashboard-card">

        <div class="card-body">

            <h4 class="mb-4">
                👥 Contacts
            </h4>

            {% for contact in contacts %}

            <div class="card contact-card shadow-sm mb-3">

                <div class="card-body">

                    <div class="row align-items-center">

                        <div class="col-md-4">
                            <h5>
                                <i class="bi bi-person-fill text-primary"></i>
                                {{ contact.name }}
                            </h5>
                        </div>

                        <div class="col-md-4">
                            <i class="bi bi-envelope-fill text-success"></i>
                            {{ contact.email }}
                        </div>

                        <div class="col-md-4">
                            <i class="bi bi-telephone-fill text-danger"></i>
                            {{ contact.phone }}
                        </div>

                    </div>

                </div>

            </div>

            {% empty %}

            <div class="alert alert-info">
                No contacts found in this category.
            </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>
</html>
