<!DOCTYPE html>
<html>
<head>
    <title>Create User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h1 class="text-center mb-4">
                    Create User
                </h1>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                {% if success %}
                <div class="alert alert-success">
                    {{ success }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ name }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ email }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input
                           type="text"
                           name="phone"
                           class="form-control"
                           value="{{ phone }}"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           minlength="10"
                           placeholder="Enter 10 digit phone number"
                           required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            value="{{ username }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Create User
                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}">
                        Login Here
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
